<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{{ title or "Questboard" }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin:0; }
    header, main { max-width: 900px; margin: 0 auto; padding: 16px; }
    header { display:flex; align-items:center; gap:12px; justify-content:space-between; }
    nav a, button, .btn { padding:8px 12px; border-radius:8px; text-decoration:none; border:1px solid #ddd; }
    img.avatar { width:28px; height:28px; border-radius:50%; vertical-align:middle; }
    .right { display:flex; gap:10px; align-items:center; }
  </style>
</head>
<body>
  <header>
    <div><strong>Questboard</strong> <small>v{{ version }}</small></div>
    <nav class="right">
      {% if user %}
        {% if user.avatar %}<img class="avatar" src="{{ user.avatar }}" alt="avatar">{% endif %}
        <span>{{ user.name or user.email }}</span>
        <a class="btn" href="/account">Account</a>
        <a class="btn" href="/logout">Logout</a>
      {% else %}
        <a id="google-login" class="btn" href="/auth/google/start">Continue with Google</a>
        <noscript><a class="btn" href="/auth/google/start?return_url=/">Login</a></noscript>
        <script>
          (function(){
            var u = location.pathname + location.search + location.hash;
            document.getElementById('google-login').href =
              "/auth/google/start?return_url=" + encodeURIComponent(u || "/");
          })();
        </script>
      {% endif %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
